version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:v1.11.3
    container_name: qabuddy-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  qabuddy-api:
    build: .
    container_name: qabuddy-api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - QDRANT_HOST=qdrant
    volumes:
      - ./data:/app/data
    depends_on:
      - qdrant
    restart: unless-stopped

  qabuddy-ui:
    build: .
    container_name: qabuddy-ui
    command: streamlit run ui/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - QABUDDY_API_URL=http://qabuddy-api:8000
    depends_on:
      - qabuddy-api
    restart: unless-stopped

volumes:
  qdrant_data:
